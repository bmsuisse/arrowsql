[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "mssql-python-rs-port"
version = "0.1.0"
description = "mssql-python with its ODBC/C++ core replaced by Rust (PyO3 + mssql-tds)"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE.upstream-mssql-python"]
authors = [{ name = "BMS Suisse" }]
keywords = ["mssql", "sql server", "tds", "dbapi", "arrow", "asyncio", "pyo3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Database",
  "Typing :: Typed",
]
# The core has no required runtime dependencies. Everything else is opt-in.
dependencies = []

[project.optional-dependencies]
# Upstream async_query preview and bulkcopy() (still served by Microsoft's mssql_py_core).
async-preview = ["mssql-python-rs==0.4.0"]
# Arrow fetch (arrow(), arrow_batch(), read_arrow()) and Arrow bulk insert.
arrow = ["pyarrow>=14"]
# Azure AD credential helpers (auth= / token_provider= with azure-identity credentials).
azure = ["azure-identity"]

[project.urls]
Homepage = "https://github.com/bmsuisse/mssql-rs"
Repository = "https://github.com/bmsuisse/mssql-rs"
Issues = "https://github.com/bmsuisse/mssql-rs/issues"
Changelog = "https://github.com/bmsuisse/mssql-rs/blob/main/CHANGELOG.md"
Upstream = "https://github.com/microsoft/mssql-python"

[tool.maturin]
python-source = "python"
module-name = "mssql_python.ddbc_bindings"
features = ["pyo3/extension-module"]
strip = true
# The sdist must carry the patched mssql-tds (the Cargo.toml patch section);
# maturin does not pick up patched path dependencies by itself. Dev-only trees stay out.
include = [{ path = "vendor/**/*", format = "sdist" }]
exclude = [
  { path = ".claude/**", format = "sdist" },
  { path = ".github/**", format = "sdist" },
  { path = "benchmarks/**", format = "sdist" },
  { path = "reviews/**", format = "sdist" },
  { path = "tests/upstream/**", format = "sdist" },
]

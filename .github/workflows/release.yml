name: Release

# Auto-release, modelled on arrowbricks: every push to main runs the full CI
# suite, then builds all wheels and the sdist iff pyproject.toml's version has
# no matching `vX.Y.Z` tag yet. A release is "bump the version (+ CHANGELOG) in a
# PR and merge it".
#
# Publishing (PyPI trusted publishing, tag, GitHub Release) is OFF unless the
# repository variable PUBLISH_PYPI is exactly 'true'. Without it this workflow
# still builds and checks everything and finishes green.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report whether a release would happen: build nothing, publish nothing"
        type: boolean
        default: false

# Two quick merges must not race each other into publishing the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  plan:
    name: Detect version bump
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            RELEASE=false
          else
            RELEASE=true
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arrowsql: release=$RELEASE version=$VERSION publish_enabled=${{ vars.PUBLISH_PYPI == 'true' }}"

  # Reused from wheels.yml: all wheels, the sdist and their smoke tests.
  wheels:
    needs: plan
    if: needs.plan.outputs.release == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    uses: ./.github/workflows/wheels.yml

  publish:
    name: Publish to PyPI, tag, GitHub Release
    needs: [plan, wheels]
    if: vars.PUBLISH_PYPI == 'true' && needs.plan.outputs.release == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # push the vX.Y.Z tag + create the GitHub Release
      id-token: write # PyPI trusted publishing (OIDC), no stored API token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List what will be uploaded
        run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # A re-run after one platform failed must not fail on the files that
          # already uploaded: PyPI rejects re-uploads of an existing filename.
          skip-existing: true
      - name: Tag release
        run: |
          git tag "v${{ needs.plan.outputs.version }}"
          git push origin "v${{ needs.plan.outputs.version }}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.plan.outputs.version }}"
          TAG="v$VERSION"
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -vxF "$TAG" | head -n1)
          # Prefer the hand-written CHANGELOG.md section ("## [X.Y.Z] ..." or
          # "## X.Y.Z ..." up to the next "## "); fall back to the commit list.
          NOTES=$(awk -v v="$VERSION" '
            /^## / { if (found) exit; h = $2; gsub(/[\[\]]/, "", h); if (h == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md)
          {
            if [ -n "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
              echo "$NOTES"
            elif [ -n "$PREV_TAG" ]; then
              echo "Changes since $PREV_TAG:"
              echo
              git log "$PREV_TAG..HEAD" --pretty=format:'- %s (%h)'
            else
              echo "Initial release."
            fi
          } > release-notes.md
          gh release create "$TAG" --title "arrowsql v$VERSION" --notes-file release-notes.md

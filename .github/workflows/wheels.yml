name: Wheels

# Builds wheels and an sdist for every platform maturin/PyO3 can target and
# uploads them as workflow artifacts. Nothing is published from here: release.yml
# calls this workflow (workflow_call) and owns the publish job.
#
# Every wheel gets an install-and-import smoke test: natively on the runner
# types that match the target, in a container for musl, and under QEMU for the
# cross-built targets (armv7, ppc64le, s390x).

on:
  pull_request:
    paths:
      - ".github/workflows/wheels.yml"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "src/**"
      - "vendor/**"
      - "python/**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SMOKE_PY: >-
    import mssql_python, arrowsql, mssql_python.ddbc_bindings as d;
    print(mssql_python.__version__, d.__version__, d.__rust_port__);
    assert d.__rust_port__

# Interpreters: CPython 3.10 to 3.15 plus free-threaded 3.14t and 3.15t where an
# interpreter exists for the platform. maturin picks them up with
# --find-interpreter (the manylinux/musllinux containers ship all of them; the
# macOS and Windows jobs install them with setup-python).

jobs:
  linux:
    name: ${{ matrix.target }} (${{ matrix.manylinux }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # smoke: native = pip install on the runner itself, container = docker
          # (QEMU when platform differs from the runner).
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_28", smoke: native }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28", smoke: native }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, smoke: container, platform: linux/amd64, image: "python:3.13-alpine" }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, smoke: container, platform: linux/arm64, image: "python:3.13-alpine" }
          - { runner: ubuntu-latest, target: powerpc64le-unknown-linux-gnu, manylinux: "2_28", interp: "-i /opt/python/cp310-cp310/bin/python -i /opt/python/cp311-cp311/bin/python -i /opt/python/cp312-cp312/bin/python -i /opt/python/cp313-cp313/bin/python -i /opt/python/cp314-cp314/bin/python -i /opt/python/cp315-cp315/bin/python -i /opt/python/cp314-cp314t/bin/python -i /opt/python/cp315-cp315t/bin/python", smoke: container, platform: linux/ppc64le, image: "python:3.13-slim" }
          - { runner: ubuntu-latest, target: s390x-unknown-linux-gnu, manylinux: "2_28", interp: "-i /opt/python/cp310-cp310/bin/python -i /opt/python/cp311-cp311/bin/python -i /opt/python/cp312-cp312/bin/python -i /opt/python/cp313-cp313/bin/python -i /opt/python/cp314-cp314/bin/python -i /opt/python/cp315-cp315/bin/python -i /opt/python/cp314-cp314t/bin/python -i /opt/python/cp315-cp315t/bin/python", smoke: container, platform: linux/s390x, image: "python:3.13-slim" }
    steps:
      - uses: actions/checkout@v4
      # No `-z pack-relative-relocs` here: it is only added by scripts/build.sh --release
      # (glibc >= 2.36), which would break manylinux_2_28.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: stable
          # --find-interpreter would also pick up the images' PyPy builds, which this
          # crate does not support (PyUnicode_1BYTE_DATA is missing from PyPy's C API).
          before-script-linux: find /usr/local/bin /usr/bin /opt/python -maxdepth 1 \( -name 'pypy*' -o -name 'pp3*' \) -exec rm -rf {} + 2>/dev/null || true
          args: --release --out dist ${{ matrix.interp || '--find-interpreter' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Wheel tags (auditwheel show)
        run: |
          python3 -m pip install --user auditwheel twine
          for w in dist/*.whl; do python3 -m auditwheel show "$w" || true; done
          python3 -m twine check dist/*.whl
      - uses: actions/setup-python@v5
        if: matrix.smoke == 'native'
        with:
          python-version: "3.13"
      - name: Smoke test, native
        if: matrix.smoke == 'native'
        run: |
          python -m pip install --no-index --find-links dist arrowsql
          cd "$RUNNER_TEMP" && python -I -c "$SMOKE_PY"
      - uses: actions/setup-python@v5
        if: matrix.smoke == 'native'
        with:
          python-version: "3.14t"
      - name: Smoke test, native free-threaded
        if: matrix.smoke == 'native'
        run: |
          python -m pip install --no-index --find-links dist arrowsql
          cd "$RUNNER_TEMP" && python -I -c "$SMOKE_PY"
      - uses: docker/setup-qemu-action@v3
        if: matrix.smoke == 'container'
      - name: Smoke test, container (${{ matrix.platform }})
        if: matrix.smoke == 'container'
        run: |
          docker run --rm --platform "${{ matrix.platform }}" -v "$PWD/dist:/dist:ro" -e SMOKE_PY "${{ matrix.image }}" \
            sh -c 'python -m pip install --no-index --find-links /dist arrowsql && cd / && python -I -c "$SMOKE_PY"'

  macos:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
            3.14t
            3.15
            3.15t
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          rust-toolchain: stable
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Smoke test
        run: |
          python -m pip install --no-index --find-links dist arrowsql
          cd "$RUNNER_TEMP" && python -I -c "$SMOKE_PY"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"
      - name: Smoke test, free-threaded
        run: |
          python -m pip install --no-index --find-links dist arrowsql
          cd "$RUNNER_TEMP" && python -I -c "$SMOKE_PY"

  windows:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, arch: x64, name: x64, base: "3.10\n3.11\n3.12\n3.13\n3.14\n3.15", extra: "3.14t\n3.15t" }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, arch: arm64, name: arm64, base: "3.11\n3.12\n3.13\n3.14\n3.15", extra: "3.10\n3.14t\n3.15t" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.base }}
          architecture: ${{ matrix.arch }}
      # Best effort: not every free-threaded / old interpreter exists for every architecture.
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: ${{ matrix.extra }}
          architecture: ${{ matrix.arch }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          rust-toolchain: stable
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
      - name: Smoke test
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist arrowsql
          cd "$RUNNER_TEMP" && python -I -c "$SMOKE_PY"

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
      - name: twine check
        run: |
          python3 -m pip install --user twine
          python3 -m twine check dist/*.tar.gz
